<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182b26"><title>Eldoria — World Prototype</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Georgia,serif;background:#142a26;color:#f7edce}button{font:inherit;cursor:pointer}#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}header{height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:linear-gradient(#2b4037,#1b302c);border-bottom:2px solid #ad9158}h1{font-size:21px;margin:0;color:#f2d89d;letter-spacing:1px}small{font-size:11px;color:#d4c6a0}.stat{text-align:right;font-size:13px}#viewport{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:#4a8ca0}canvas{display:block;width:100%;height:100%;touch-action:none}#topnote{position:absolute;left:10px;top:10px;background:#142b27df;border:1px solid #bda46b;border-radius:8px;padding:8px 11px;font-size:12px;pointer-events:none;max-width:75%}#zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}#zoom button,.panel button{border:1px solid #bca36a;background:linear-gradient(#526f54,#294b3f);color:#fff0cb;border-radius:8px;padding:9px 12px;font-weight:bold;box-shadow:0 2px 5px #0006}#zoom button{font-size:20px;padding:4px 12px}#panel{background:linear-gradient(#263e35,#172d29);border-top:2px solid #bda46b;padding:10px 12px 12px;flex:none}.controls{display:flex;gap:9px;align-items:center;justify-content:space-between}.die{width:62px;height:62px;flex:none;border:2px solid #ddbd77;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#453e32}.die strong{font-size:30px;line-height:1}.die small{font-size:10px}.buttons{display:flex;flex:1;gap:8px}.buttons button{flex:1;min-height:47px;font-size:14px}.buttons button:disabled{opacity:.4}.info{font-size:12px;line-height:1.4;margin-top:7px;color:#e5d7b5}.modal{position:absolute;inset:0;background:#081b19c9;display:none;align-items:center;justify-content:center;padding:22px;z-index:10}.modal.show{display:flex}.sheet{width:min(420px,100%);border:2px solid #c7a96d;border-radius:14px;background:linear-gradient(#354e3f,#1a302a);padding:20px;box-shadow:0 15px 50px #000b;text-align:center}.sheet h2{color:#f3d698;margin:4px 0 10px}.sheet p{font-size:15px;line-height:1.5}.sheet button{margin-top:12px;background:#af8b4b;color:#172a25;border:0;border-radius:8px;padding:12px 25px;font-weight:bold}.hint{color:#cfbe94;font-size:12px}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:#d5c8a7}@media(max-width:380px){h1{font-size:18px}.buttons button{font-size:12px;padding:8px}}
</style></head><body><div id="app"><header><div><h1>✦ ELDORIA ✦</h1><small>THE FIRST CONTINENT</small></div><div class="stat">LVL 1 · Wanderer<br><small id="coords">Grid —</small></div></header><main id="viewport"><canvas id="map"></canvas><div id="topnote">Drag to explore · Tap an adjacent tile to move</div><div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div><div class="modal" id="modal"><div class="sheet"><div style="font-size:35px" id="symbol">🏰</div><h2 id="place">Highcrest Castle</h2><p id="description"></p><div class="hint">Interior maps, shops and quests arrive in the next build.</div><button id="close">Return to World</button></div></div></main><section id="panel"><div class="controls"><div class="die"><strong id="die">12</strong><small>D12</small></div><div class="buttons"><button id="roll">🎲 Roll D12</button><button id="enter" disabled>Enter Location</button></div></div><div class="info" id="status">Welcome to Eldoria. Roll to begin your journey.</div><div class="legend"><span>🌲 Forest</span><span>⛰ Mountains</span><span>🌾 Fields</span><span>🏰 Castle</span><span>⚓ Ports</span></div></section></div><script>
(()=>{'use strict';const N=50,canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),vp=document.getElementById('viewport');let tile=32,ox=0,oy=0,drag=null,moved=false,remaining=0,rolled=false,player={x:24,y:28};const $=id=>document.getElementById(id);const places=[{x:3,y:26,name:'Westhaven',icon:'⚓',desc:'The western port, a busy harbor of merchants, fishermen and distant sailors.'},{x:46,y:24,name:'Eastwatch',icon:'⚓',desc:'The eastern port and gateway to undiscovered shores.'},{x:25,y:24,name:'Highcrest Castle',icon:'🏰',desc:'The royal seat of Eldoria. The king’s court and the heart of the realm.'},{x:15,y:14,name:'Oakshire',icon:'🏘',desc:'A woodland town known for hunters, herbalists and forest trails.'},{x:34,y:12,name:'Millbrook',icon:'🏘',desc:'A prosperous farming village with mills and trading stalls.'},{x:34,y:37,name:'Stoneford',icon:'🏘',desc:'A frontier town built beside the southern highlands.'},{x:15,y:39,name:'Shadowfang Cave',icon:'🕳',desc:'A dark cavern carved into the mountain. Strange creatures dwell within.'}];const byPos=new Map(places.map(p=>[p.x+','+p.y,p]));function noise(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}function land(x,y){let dx=(x-24.5)/25,dy=(y-24.5)/25;return dx*dx*.78+dy*dy*.85 + .12*Math.sin(y*.27)+.08*Math.sin(x*.33)<.99}function terrain(x,y){if(!land(x,y))return 'sea';let m=Math.sin(x*.23+y*.1)+Math.cos(y*.19-x*.06);if((x<21&&y>32)||(x>34&&y<18)||m>1.5)return 'mountain';if((x<22&&y<30)||(x>27&&y>27)||m<-.5)return 'forest';return 'field'}const fixed=new Map();for(const p of places)fixed.set(p.x+','+p.y,p);function type(x,y){if(x<0||y<0||x>=N||y>=N)return 'void';if(fixed.has(x+','+y))return 'field';return terrain(x,y)}const colors={sea:['#508fa1','#5898a8','#4b879b'],field:['#9bbf75','#a9c880','#8caf6a'],forest:['#477c55','#4d865b','#598d60'],mountain:['#8d9185','#a5a79b','#787f78'],void:['#23435b']};function fit(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=vp.clientWidth*dpr;canvas.height=vp.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}function center(){ox=vp.clientWidth/2-(player.x+.5)*tile;oy=vp.clientHeight/2-(player.y+.5)*tile}function draw(){const w=vp.clientWidth,h=vp.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#508fa1';ctx.fillRect(0,0,w,h);const x0=Math.max(0,Math.floor(-ox/tile)),x1=Math.min(N,Math.ceil((w-ox)/tile)),y0=Math.max(0,Math.floor(-oy/tile)),y1=Math.min(N,Math.ceil((h-oy)/tile));for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const px=ox+x*tile,py=oy+y*tile,t=type(x,y),n=noise(x,y),c=colors[t][Math.floor(n*colors[t].length)];ctx.fillStyle=c;ctx.fillRect(px,py,tile+.4,tile+.4);if(tile>=19){ctx.save();ctx.translate(px+tile/2,py+tile/2);if(t==='forest'){ctx.fillStyle='#255c40';for(let j=0;j<3;j++){let xx=(noise(x+j,y)*.7-.35)*tile,yy=(noise(x,y+j)*.65-.3)*tile;ctx.beginPath();ctx.moveTo(xx,yy-tile*.24);ctx.lineTo(xx-tile*.15,yy+tile*.16);ctx.lineTo(xx+tile*.15,yy+tile*.16);ctx.fill()}}else if(t==='mountain'){ctx.fillStyle='#d7d6c3';ctx.beginPath();ctx.moveTo(-tile*.32,tile*.24);ctx.lineTo(0,-tile*.31);ctx.lineTo(tile*.3,tile*.24);ctx.fill();ctx.fillStyle='#777f7b';ctx.beginPath();ctx.moveTo(0,-tile*.31);ctx.lineTo(tile*.3,tile*.24);ctx.lineTo(tile*.07,tile*.24);ctx.fill()}else if(t==='field'){ctx.strokeStyle='#638c4d';ctx.lineWidth=1.2;for(let j=0;j<3;j++){let a=(j-1)*tile*.2;ctx.beginPath();ctx.moveTo(a,tile*.2);ctx.lineTo(a+tile*.07,tile*.05);ctx.stroke()}}else{ctx.strokeStyle='#acd6d4';ctx.globalAlpha=.45;ctx.beginPath();ctx.arc(0,0,tile*.22,Math.PI*.2,Math.PI*.8);ctx.stroke()}ctx.restore()}ctx.strokeStyle='rgba(26,47,39,.24)';ctx.lineWidth=Math.max(.5,tile*.025);ctx.strokeRect(px+.3,py+.3,tile-.6,tile-.6);if(rolled&&remaining>0&&Math.abs(x-player.x)+Math.abs(y-player.y)===1&&t!=='sea'){ctx.fillStyle='#fce59a44';ctx.fillRect(px+2,py+2,tile-4,tile-4)}}for(const p of places){const px=ox+(p.x+.5)*tile,py=oy+(p.y+.5)*tile;if(px< -80||px>w+80||py< -80||py>h+80)continue;ctx.font=`${Math.max(16,tile*.7)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#102b24';ctx.shadowBlur=5;ctx.fillText(p.icon,px,py);ctx.shadowBlur=0;if(tile>=24){ctx.font=`bold ${Math.max(9,tile*.31)}px Georgia`;const width=ctx.measureText(p.name).width+9;ctx.fillStyle='#18372dc9';ctx.fillRect(px-width/2,py+tile*.35,width,Math.max(12,tile*.35));ctx.fillStyle='#f6e7b8';ctx.fillText(p.name,px,py+tile*.53)}}const px=ox+(player.x+.5)*tile,py=oy+(player.y+.5)*tile;ctx.beginPath();ctx.fillStyle='#ffdd81';ctx.strokeStyle='#4c2f19';ctx.lineWidth=2.5;ctx.arc(px,py,Math.max(7,tile*.27),0,Math.PI*2);ctx.fill();ctx.stroke();ctx.font=`${Math.max(13,tile*.48)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🧙',px,py);$('coords').textContent=`Grid ${player.x+1}, ${player.y+1}`}
function update(){const p=byPos.get(player.x+','+player.y);$('enter').disabled=!p;$('status').textContent=p?`${p.name} · ${remaining} moves left. Tap Enter Location.`:`${remaining} moves remaining · Move orthogonally, one square at a time.`;draw()}function move(x,y){if(!rolled||remaining<=0){$('status').textContent='Roll the D12 to receive movement points.';return}if(Math.abs(x-player.x)+Math.abs(y-player.y)!==1){$('status').textContent='Choose an adjacent square. Diagonal travel is not allowed.';return}if(type(x,y)==='sea'||type(x,y)==='void'){$('status').textContent='You cannot travel into the sea.';return}player={x,y};remaining--;update()}function openPlace(){const p=byPos.get(player.x+','+player.y);if(!p)return;$('symbol').textContent=p.icon;$('place').textContent=p.name;$('description').textContent=p.desc;$('modal').classList.add('show')}$('roll').onclick=()=>{remaining=1+Math.floor(Math.random()*12);rolled=true;$('die').textContent=remaining;update()};$('enter').onclick=openPlace;$('close').onclick=()=>$('modal').classList.remove('show');$('zin').onclick=()=>zoom(1.25);$('zout').onclick=()=>zoom(.8);function zoom(f){const cx=vp.clientWidth/2,cy=vp.clientHeight/2;const nx=(cx-ox)/tile,ny=(cy-oy)/tile;tile=Math.max(15,Math.min(70,tile*f));ox=cx-nx*tile;oy=cy-ny*tile;draw()}canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,ox,oy};moved=false;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>7)moved=true;if(moved){ox=drag.ox+dx;oy=drag.oy+dy;draw()}});canvas.addEventListener('pointerup',e=>{if(!drag)return;if(!moved){const r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-ox)/tile),y=Math.floor((e.clientY-r.top-oy)/tile);if(x===player.x&&y===player.y&&byPos.has(x+','+y))openPlace();else move(x,y)}drag=null});window.addEventListener('resize',fit);center();fit();update();})();
</script></body></html>
